version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: juli_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/juli_churn.db:/app/juli_churn.db
    restart: always
    networks:
      - juli_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: juli_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    networks:
      - juli_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.5.0
    container_name: juli_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./artifacts --host 0.0.0.0 --port 5000
    volumes:
      - ./ml/mlruns:/mlflow/mlruns
    restart: always
    networks:
      - juli_network

networks:
  juli_network:
    driver: bridge
